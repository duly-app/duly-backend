name: Pull Request Checks

on:
- pull_request
- merge_group

concurrency:
  # Only allow one run at a time of this workflow per PR
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4.0.0
      with:
        python-version: "3.13"
    - name: Install tox and poetry
      run: python -m pip install tox poetry
    - name: Run linting checks
      run: tox -e lint
    - name: Run formatting checks
      run: tox -e format
    - name: Run type checks
      run: tox -e typecheck

  # unit-tests:
  #   name: Unit Tests ({{ matrix.os }})
  #   runs-on: {{ matrix.os }}
  #   strategy:
  #     matrix:
  #       os: [ubuntu-latest, macos-latest]
  #   steps:
  #   - uses: actions/checkout@v3
  #   - uses: actions/setup-python@v4.0.0
  #     with:
  #       python-version: "3.13"
  #   - name: Install tox and poetry
  #     run: python -m pip install tox poetry
  #   - name: Run unit tests
  #     run: tox -e py313 -- tests/unit --randomly-seed=$RANDOM

  integration-tests:
    name: Integration Tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: duly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4.0.0
      with:
        python-version: "3.13"
    - name: Install tox and poetry
      run: python -m pip install tox poetry
    - name: Run postgres integration tests
      env:
        TEST_DATABASE_URL: postgresql+psycopg2://admin:password@localhost:5432/duly_test
      run: tox -e py313 -- tests/integration --randomly-seed=$RANDOM